<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slot Machine</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Upright:wght@300;400;500;600;700&family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=League+Gothic&family=Lilita+One&family=Manrope:wght@200..800&family=Nunito+Sans:ital,opsz,wght@0,6..12,200..1000;1,6..12,200..1000&family=Nunito:ital,wght@0,200..1000;1,200..1000&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Roboto:ital,wght@0,100..900;1,100..900&family=Source+Sans+3:ital,wght@0,200..900;1,200..900&family=Titan+One&display=swap" rel="stylesheet">

</head>
<body>
    <h1>Welcome to Slot Machine</h1>

    <!-- Reel Container -->
    <section class="reel-container">

        <section class="reel-wrapper">

       
        <!-- Reel-One -->
        <div class="reel-box ">
            <p class="reel"></p>
        </div>

        <!-- Reel 2 -->
        <div class="reel-box ">
            <p class="reel"></p>
        </div>

        <!-- Reel 3 -->
        <div class="reel-box ">
            <p class="reel"></p>
        </div>
         </section>

         <!-- Total Credit section -->
          <section class="credit-wrapper">
                <div>
                    <p>Total Credit</p>
                       <p id="credit"></p>
                </div>
              
                 <div>
                <p>Current Bet Amount</p>
                <p id="bet"></p>
                      </div>
                    <div>
                <p>Starting Amount</p>
                <p id="current"></p>
                      </div>
            
          </section>
    </section>

        <section class="btn-container">
            <button class="btn" id="spin">Spin</button>
            <button class="btn" id="bet-5">Bet-5</button>
            <button class="btn" id="bet-50" >bet-50</button>
        </section>

        <script src="js/main.js"></script>
</body>
</html>
